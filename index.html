<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WGU Faculty CRM | Student Portal</title>
  <style>
    :root {
      --navy-900: #00284c;
      --navy-800: #003366;
      --navy-700: #0b467d;
      --teal-600: #00738a;
      --teal-500: #008ca8;
      --teal-50: #eff8fa;
      --bg-body: #f3f5f8;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --border: #dde3ea;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --comp-green: #2e8540;
      --comp-amber: #e67e22;
      --comp-red: #d9381e;
      --comp-blue: #00738a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      font-size: 14px;
    }

    /* Top System Bar */
    .sys-topbar {
      background-color: var(--navy-900);
      color: #ffffff;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .sys-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.3px;
    }
    .sys-badge {
      background: var(--teal-600);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .sys-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12.5px;
      color: #cbd5e1;
    }
